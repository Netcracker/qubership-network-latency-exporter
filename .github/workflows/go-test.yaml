name: Go test with Sonar
on:
  push: {}
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sonar-project-key: ${{ steps.config.outputs.sonar-project-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve sonar project key based on restricted actors
        id: config
        env:
          ACTOR: ${{ github.actor }}
        run: |
          restricted=$(python3 -c "
          import yaml, os
          with open('.github/config/build-config.yaml') as f:
              config = yaml.safe_load(f)
          actors = config.get('restricted-actors', [])
          print('true' if os.environ['ACTOR'] in actors else 'false')
          ")
          if [ "$restricted" = "true" ]; then
            echo "sonar-project-key=" >> "$GITHUB_OUTPUT"
          else
            echo "sonar-project-key=${{ vars.SONAR_PROJECT_KEY }}" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: prepare
    name: Build and test with coverage
    uses: IldarMinaev/qubership-core-infra/.github/workflows/generic-go-build.yaml@738a91c79f85dc019cad7344de2c4cc9ada49a5b # PR #368 canary
    with:
      sonar-project-key: ${{ needs.prepare.outputs.sonar-project-key }}
      dry-run: true
    permissions:
      contents: read
      pull-requests: write
      packages: write

  direct-docker-dry-run:
    name: Direct Docker dry run with a package-write caller ceiling
    uses: IldarMinaev/qubership-core-infra/.github/workflows/docker-build.yaml@738a91c79f85dc019cad7344de2c4cc9ada49a5b # PR #368 canary
    with:
      dry-run: true
    permissions:
      contents: read
      packages: write
